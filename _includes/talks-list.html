{% for talk in site.data.talks %}
<div class="list__item">
  <article class="archive__item">
    <h3 class="archive__item-title">{{ talk.title }}</h3>
    <p class="page__meta">{{ talk.year }} · {{ talk.type }}</p>
    <p class="archive__item-excerpt">{{ talk.event }}<br>{{ talk.location }}</p>
    {% if talk.award %}<p class="archive__item-excerpt"><strong>{{ talk.award }}</strong></p>{% endif %}
  </article>
</div>
{% endfor %}
