{% for course in site.data.teaching %}
<div class="list__item">
  <article class="archive__item">
    <h3 class="archive__item-title">{{ course.code }}: {{ course.title }}</h3>
    <p class="page__meta">{{ course.terms }}</p>
    <p class="archive__item-excerpt">{{ course.level }}</p>
  </article>
</div>
{% endfor %}
