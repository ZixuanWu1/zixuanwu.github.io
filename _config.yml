# Personal academic site hosted at the account's GitHub Pages root.
locale: en-US
title: Zixuan Wu
title_separator: "-"
name: Zixuan Wu
description: Zixuan Wu is a Ph.D. student in Statistics at the University of Chicago, working on causal inference, high-dimensional statistics, statistical learning, and uncertainty quantification.
url: https://zixuanwu1.github.io
baseurl: ""
repository: ZixuanWu1/zixuanwu1.github.io
timezone: America/Chicago
site_theme: default

# Retain compatibility with the Academic Pages templates and utilities.
author:
  avatar: profile.png
  name: Zixuan Wu
  bio: Ph.D. Student in Statistics
  location: Chicago, Illinois
  employer: University of Chicago
  email: zixuanwu@uchicago.edu
  github: ZixuanWu1
  linkedin: zixuan-wu-15abb7177
  googlescholar: https://scholar.google.com/citations?user=GBNOlFQAAAAJ&hl=en
atom_feed:
  hide: true

include:
  - _pages
exclude:
  - .bundle
  - .github
  - .sass-cache
  - .jekyll-cache
  - vendor
  - local
  - tmp
  - node_modules
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - package.json
  - package-lock.json
  - Dockerfile
  - docker-compose.yaml
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - scripts
  - markdown_generator
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - _posts
  - _drafts
  - _publications
  - _talks
  - _teaching
  - _portfolio
  - files
  - _pages/archive-layout-with-content.md
  - _pages/category-archive.html
  - _pages/collection-archive.html
  - _pages/markdown.md
  - _pages/non-menu-page.md
  - _pages/page-archive.html
  - _pages/portfolio.html
  - _pages/tag-archive.html
  - _pages/talkmap.html
  - _pages/terms.md
  - _pages/year-archive.html
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor

defaults:
  - scope:
      path: ''
      type: pages
    values:
      layout: single
      author_profile: true

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
